name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: Parser & Memory Benchmark Regression Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Parser Throughput Benchmark
        run: |
          python tests/benchmarks/bench_parser.py --files 100 --lines 50

      - name: Execute Memory Allocation Benchmark
        run: |
          python tests/benchmarks/bench_memory.py --cycles 100
