name: Dependency Validation & Checksum

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-check:
    name: Validate Dependency Tree & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Verify Tree
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Export Frozen Dependency Checksum
        run: |
          pip freeze > resolved_requirements.txt
          sha256sum resolved_requirements.txt pyproject.toml
          rm -f resolved_requirements.txt
