name: Security Vulnerability & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  security-audit:
    name: Static Security & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit Static Security Analysis
        run: |
          bandit -r src/ scripts/ -ll

      - name: Check Python Dependencies for Known Vulnerabilities
        run: |
          pip install -e .
          pip-audit --desc || true

      - name: Scan Repository for Accidental Secrets
        run: |
          ! git grep -En "(AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|-----BEGIN (RSA|EC) PRIVATE KEY-----)" -- ':(exclude).github/workflows/security_scan.yml'
