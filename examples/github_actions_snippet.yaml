# Drop-in GitHub Actions job snippet to validate .env configurations in CI/CD pipelines
# using env-validator-cli.

jobs:
  validate-environment:
    name: Validate Environment Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install env-validator-cli
        run: |
          pip install env-validator-cli

      - name: Validate Production .env File
        run: |
          python -m src.validator.cli \
            --env .env.production \
            --schema schemas/env_schema.yaml \
            --strict
