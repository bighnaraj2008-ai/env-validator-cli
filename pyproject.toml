[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "env-validator-cli"
version = "1.0.0"
description = "Deterministic zero-dependency environment configuration validator and type caster"
readme = "README.md"
authors = [{ name = "bighnaraj2008-ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
    "pyyaml>=6.0",
]

[project.scripts]
env-validator = "src.validator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "schemas*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
